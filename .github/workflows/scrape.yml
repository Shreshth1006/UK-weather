name: Scrape Weather Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for Met Office scraper (Playwright)
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Install dependencies for AccuWeather scraper (Scrapfly)
        run: pip install scrapfly-sdk beautifulsoup4
      - name: Run Met Office scraper (UK cities)
        run: python scraper.py
      - name: Run AccuWeather scraper (US cities)
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
        run: python scraper_accuweather.py
      - name: Commit and push updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (
            git commit -m "chore: update weather data $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push origin main --force
          )
